domain: "cybersecurity"

niches:
  - "Cloud Security & IAM (AWS/GCP/Azure, CNAPP, least-privilege)"
  - "Application Security & DevSecOps (API security, secrets sprawl, dependency supply chain)"
  - "SecOps & Detection Engineering (alert fatigue, SIEM/SOAR noise, incident response)"
  - "Identity & Access Management (FIDO2, WebAuthn, AiTM phishing, credential hygiene)"
  - "AI Security & Red Teaming (prompt injection, model poisoning, agent safety)"

target_keywords:
  - "cybersecurity"
  - "infosec"
  - "security"
  - "cyber"
  - "cloud security"
  - "appsec"
  - "devsecops"
  - "ciso"
  - "soc"
  - "zero trust"
  - "incident response"
  - "iam"
  - "mfa"
  - "fido2"
  - "phishing"
  - "threat intelligence"
  - "threat intel"
  - "vulnerability"
  - "vulnerabilities"
  - "exploit"
  - "cve"
  - "malware"
  - "ransomware"
  - "detection"
  - "penetration testing"
  - "pentest"
  - "siem"
  - "edr"
  - "xdr"
  - "red team"
  - "blue team"
  - "least privilege"
  - "rce"
  - "owasp"
  - "cissp"
  - "oscp"
  - "ceh"
  - "cism"
  - "security+"

target_personas:
  - "Chief Information Security Officer (CISO)"
  - "VP of Security / Head of Infosec"
  - "Security Architect / Staff Security Engineer"
  - "Detection / SecOps Engineer"
  - "DevSecOps / AppSec Lead"
  - "Cybersecurity Startup Founder"

anti_slop:
  banned_phrases:
    - "in today's fast-paced world"
    - "in today's digital age"
    - "in the digital age"
    - "delve"
    - "delving"
    - "testament"
    - "game-changer"
    - "game changer"
    - "here's a hard truth"
    - "let that sink in"
    - "revolutionize"
    - "tapestry"
    - "beacon"
    - "paramount"
    - "pivotal"
    - "plethora"
    - "embark"
    - "it goes without saying"
    - "buckle up"
    - "robust shield"
    - "stay vigilant"
  generic_comment_praise:
    - "great post"
    - "thanks for sharing"
    - "totally agree"
    - "100% agree"
    - "spot on"
    - "love this"
    - "well said"

commenting_rules:
  max_sentences: 2
  min_sentences: 1
  required_modes:
    - "professional_appreciation"
    - "concrete_micro_insight"
    - "supportive_peer_affirmation"
  tone: "Appreciative, supportive, peer-to-peer, technically grounded, strictly zero questions"

posting_rules:
  framework:
    - "Hook"
    - "Core Insight"
    - "Example or Data Point"
    - "Takeaway or Open Question"
  max_emojis: 2
  paragraph_style: "Punchy, short paragraphs with clear white space"

safety:
  rate_limits:
    max_likes_per_hour: 100
    max_likes_per_day: 300
    max_comments_per_hour: 40
    max_comments_per_day: 100
    max_posts_per_day: 10
    backoff_cooldown_seconds: 3600 # 60 minutes on rate limit or API block
  confidence_threshold_auto_engage: 85 # < 85% routes to HITL approval queue
