[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-linkedin"
version = "1.2.0"
description = "Autonomous AI-powered LinkedIn growth and engagement agent with intelligent post evaluation, zero-slop commenting, and human-in-the-loop safeguards."
readme = "README.md"
authors = [
    { name = "Akhil Binu", email = "akhilbinu@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = [
    "linkedin",
    "ai-agent",
    "playwright",
    "groq",
    "automation",
    "growth-hacking",
    "cybersecurity",
    "llm",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "reportlab>=4.0.0"
]

[project.scripts]
linkedbot = "main:main"
agent-linkedin = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]

[tool.setuptools]
packages = ["config", "connectors", "core", "web"]
py-modules = ["main", "menu"]

[tool.setuptools.package-data]
config = ["*.yaml"]

[project.urls]
Homepage = "https://github.com/Akhil-Binu/agent-linkedin"
Documentation = "https://github.com/Akhil-Binu/agent-linkedin#readme"
Repository = "https://github.com/Akhil-Binu/agent-linkedin.git"
"Bug Tracker" = "https://github.com/Akhil-Binu/agent-linkedin/issues"
